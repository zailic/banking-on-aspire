syntax = "proto3";

package banking.accounts.v1;

import "banking/auth/v1/authorization.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";

option csharp_namespace = "Banking.Contracts.Accounts.V1";
option go_package = "github.com/zailic/banking-on-aspire/platform/gen/go/banking/accounts/v1;accountsv1";
// Identifies the user resource owned by the Users service.
option (google.api.resource_definition) = {
  type: "banking-on-aspire.dev/User"
  pattern: "users/{user}"
};
// Identifies a beneficiary managed by the Contacts service.
option (google.api.resource_definition) = {
  type: "banking-on-aspire.dev/Contact"
  pattern: "users/{user}/contacts/{contact}"
};

// Manages bank accounts owned by application users.
service AccountsService {
  // Creates an empty account for an active application user.
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/{parent=users/*}/accounts"
      body: "account"
    };
    option (banking.auth.v1.authorization) = {required_permissions: "accounts.create"};
  }

  // Lists the accounts owned by a user.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/{parent=users/*}/accounts"};
    option (banking.auth.v1.authorization) = {required_permissions: "accounts.balance.read"};
  }

  // Gets one account, including its current available balance.
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/{name=accounts/*}"};
    option (banking.auth.v1.authorization) = {required_permissions: "accounts.balance.read"};
  }

  // Permanently closes an account while retaining its audit history.
  rpc CloseAccount(CloseAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/{name=accounts/*}:close"
      body: "*"
    };
    option (banking.auth.v1.authorization) = {required_permissions: "accounts.close"};
  }

  // Sends a payment from an owned account to a saved beneficiary.
  rpc SendPayment(SendPaymentRequest) returns (Payment) {
    option (google.api.http) = {
      post: "/v1/{parent=accounts/*}/payments"
      body: "*"
    };
    option (banking.auth.v1.authorization) = {required_permissions: "payments.send"};
  }

  // Adds funds to an owned account for the local learning cash-in flow.
  rpc DepositFunds(DepositFundsRequest) returns (Deposit) {
    option (google.api.http) = {
      post: "/v1/{parent=accounts/*}/deposits"
      body: "*"
    };
    option (banking.auth.v1.authorization) = {required_permissions: "accounts.deposit"};
  }
}

// A bank account owned by one application user.
message Account {
  option (google.api.resource) = {
    type: "banking-on-aspire.dev/Account"
    pattern: "accounts/{account}"
    singular: "account"
    plural: "accounts"
  };

  // Canonical resource name, for example accounts/01k3example.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Canonical name of the user that owns the account.
  string owner = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "banking-on-aspire.dev/User"
  ];

  // User-facing account label, for example Everyday account.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Product category associated with the account.
  AccountType type = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Current account lifecycle state.
  AccountStatus status = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Funds currently available for transactions.
  google.type.Money available_balance = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time when the account was opened.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time when the account was last modified.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Entity tag used for optimistic concurrency control.
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Immutable bank-facing account number used when addressing transfers.
  // Internal services should prefer the canonical resource name when possible.
  string account_number = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ISO 4217 currency code used by this account, for example EUR.
  string currency_code = 11 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
}

// Request message for CreateAccount.
message CreateAccountRequest {
  // User that will own the account, in the form users/{user}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/User"
  ];

  // Account attributes supplied by the administrator. Server-managed fields
  // such as owner, status, balance, account number and timestamps are ignored.
  Account account = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional stable identifier. When omitted, the server generates one.
  string account_id = 3;
}

// Product category for an account.
enum AccountType {
  // The account type has not been specified.
  ACCOUNT_TYPE_UNSPECIFIED = 0;

  // Account intended for everyday payments and deposits.
  ACCOUNT_TYPE_CHECKING = 1;

  // Account intended for holding savings.
  ACCOUNT_TYPE_SAVINGS = 2;
}

// Lifecycle state for an account.
enum AccountStatus {
  // The account status has not been specified.
  ACCOUNT_STATUS_UNSPECIFIED = 0;

  // The account may be used normally.
  ACCOUNT_STATUS_OPEN = 1;

  // The account is temporarily restricted from transactions.
  ACCOUNT_STATUS_FROZEN = 2;

  // The account has been permanently closed.
  ACCOUNT_STATUS_CLOSED = 3;
}

// Request message for ListAccounts.
message ListAccountsRequest {
  // User that owns the accounts, in the form users/{user}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/User"
  ];

  // Maximum number of accounts to return.
  int32 page_size = 2;

  // Token from a previous ListAccounts response.
  string page_token = 3;
}

// Response message for ListAccounts.
message ListAccountsResponse {
  // Accounts owned by the requested user.
  repeated Account accounts = 1;

  // Token for retrieving the next page, or empty when no page remains.
  string next_page_token = 2;
}

// Request message for GetAccount.
message GetAccountRequest {
  // Account resource name in the form accounts/{account}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Account"
  ];
}

// Request message for CloseAccount.
message CloseAccountRequest {
  // Account resource name in the form accounts/{account}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Account"
  ];

  // Optional entity tag used to reject a stale close request.
  string etag = 2;
}

// A completed payment from an account to a saved beneficiary.
message Payment {
  option (google.api.resource) = {
    type: "banking-on-aspire.dev/Payment"
    pattern: "payments/{payment}"
    singular: "payment"
    plural: "payments"
  };

  // Canonical resource name, for example payments/01k3example.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Account debited by the payment.
  string source_account = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Account"
  ];

  // Saved beneficiary selected by the caller.
  string beneficiary = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Contact"
  ];

  // Positive amount debited from the source account.
  google.type.Money amount = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional user-facing payment reference.
  string reference = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Current payment lifecycle state.
  PaymentStatus status = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time when the payment completed.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Caller-provided idempotency key.
  string request_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Lifecycle state of a payment.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_COMPLETED = 1;
}

// Request message for SendPayment.
message SendPaymentRequest {
  // Account to debit, in the form accounts/{account}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Account"
  ];

  // Saved beneficiary in the form users/{user}/contacts/{contact}.
  string beneficiary = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Contact"
  ];

  // Positive amount to send. Its currency must match the source account.
  google.type.Money amount = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional user-facing payment reference, limited to 140 characters.
  string reference = 4;

  // Stable caller-generated idempotency key.
  string request_id = 5 [(google.api.field_behavior) = REQUIRED];
}

// A completed cash-in operation on an account.
message Deposit {
  option (google.api.resource) = {
    type: "banking-on-aspire.dev/Deposit"
    pattern: "deposits/{deposit}"
    singular: "deposit"
    plural: "deposits"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string account = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Account"
  ];
  google.type.Money amount = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string reference = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string request_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for DepositFunds.
message DepositFundsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "banking-on-aspire.dev/Account"
  ];
  google.type.Money amount = 2 [(google.api.field_behavior) = REQUIRED];
  string reference = 3;
  string request_id = 4 [(google.api.field_behavior) = REQUIRED];
}
