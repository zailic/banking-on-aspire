name: Release components

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      paths-released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: needs.release-please.outputs.releases-created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: services/accounts
            component: accounts
            dockerfile: build/go-service.Dockerfile
            service: accounts
            command: accounts
          - path: services/contacts
            component: contacts
            dockerfile: build/go-service.Dockerfile
            service: contacts
            command: contacts
          - path: services/transactions
            component: transactions
            dockerfile: build/go-service.Dockerfile
            service: transactions
            command: transactions
          - path: services/users
            component: users
            dockerfile: build/go-service.Dockerfile
            service: users
            command: users
          - path: frontend/Banking.Web
            component: banking-web
            dockerfile: frontend/Banking.Web/Dockerfile
            service: ''
            command: ''
    steps:
      - name: Checkout released revision
        if: contains(fromJSON(needs.release-please.outputs.paths-released), matrix.path)
        uses: actions/checkout@v4

      - name: Set image metadata
        if: contains(fromJSON(needs.release-please.outputs.paths-released), matrix.path)
        id: image
        shell: bash
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
          VERSION_FILE: ${{ matrix.path }}/version.txt
        run: |
          owner="${REGISTRY_OWNER,,}"
          version="$(tr -d '[:space:]' < "$VERSION_FILE")"
          test -n "$version"
          echo "name=ghcr.io/${owner}/banking-on-aspire/${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: contains(fromJSON(needs.release-please.outputs.paths-released), matrix.path)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: contains(fromJSON(needs.release-please.outputs.paths-released), matrix.path)
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: contains(fromJSON(needs.release-please.outputs.paths-released), matrix.path)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            COMMAND=${{ matrix.command }}
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision }}
          provenance: mode=max
          sbom: true

